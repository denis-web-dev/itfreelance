name: Проверки

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Минимальные права: проверки только читают код
permissions:
  contents: read

jobs:
  frontend:
    name: Фронтенд (линтер и сборка)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка кода линтером
        run: npm run lint

      # Ловит ошибки, которых не видит линтер: нет файла, неверный путь импорта
      - name: Проверка сборки
        run: npm run build

  backend:
    name: Бэкенд (тесты)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Временная база PostgreSQL: существует только пока идёт проверка
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: freelance_exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Тестовые значения: настоящих секретов здесь нет, база живёт только внутри проверки
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/freelance_exchange_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      ACCESS_TOKEN_EXPIRES: 15m
      REFRESH_TOKEN_EXPIRES: 7d

    steps:
      - name: Получение кода
        uses: actions/checkout@v4

      - name: Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установка зависимостей
        run: npm ci

      - name: Генерация Prisma Client
        run: npx prisma generate

      - name: Применение миграций к тестовой базе
        run: npx prisma migrate deploy

      - name: Запуск тестов
        run: npm test
